<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>RAW Stream</title>
<meta name="theme-color" content="#090d16">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* ===== RAW Stream · styles =====
   Layout concept: one-column phone shell (header / scrolling screen / bottom nav),
   rails and grids of poster cards, full-viewport player overlay on top.
   All colors are tokens. Dark is the home look; light follows the viewer or the Settings choice. */
:root {
  --bg: #090d16;
  --bg2: #0e1424;
  --surface: #151c2e;
  --surface2: #1e2742;
  --line: #28325a;
  --fg: #eef1fa;
  --fg2: #a7b0cb;
  --fg3: #6e7896;
  --accent: #ff6b4a;
  --on-accent: #1a0a05;
  --good: #3ddc97;
  --warn: #ffc857;
  --bad: #ff5d73;
  --scrim: rgba(4, 7, 14, .66);
  --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  --pl-fg: #ffffff;
  --pl-fg2: rgba(255, 255, 255, .72);
  --pl-panel: rgba(14, 18, 30, .94);
  --pl-line: rgba(255, 255, 255, .16);
  --font-display: 'Unbounded', 'Hind Siliguri', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Hanken Grotesk', 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', system-ui, sans-serif;
  --r-card: 14px;
  --r-ctl: 12px;
  --nav-h: 62px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6fb; --bg2: #eaeef7; --surface: #ffffff; --surface2: #e7ecf8; --line: #d3dbee;
    --fg: #121828; --fg2: #444e6c; --fg3: #7a84a2;
    --scrim: rgba(10, 16, 32, .5); --shadow: 0 14px 40px rgba(20, 30, 70, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f6fb; --bg2: #eaeef7; --surface: #ffffff; --surface2: #e7ecf8; --line: #d3dbee;
  --fg: #121828; --fg2: #444e6c; --fg3: #7a84a2;
  --scrim: rgba(10, 16, 32, .5); --shadow: 0 14px 40px rgba(20, 30, 70, .18);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #090d16; --bg2: #0e1424; --surface: #151c2e; --surface2: #1e2742; --line: #28325a;
  --fg: #eef1fa; --fg2: #a7b0cb; --fg3: #6e7896;
  --scrim: rgba(4, 7, 14, .66); --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ic svg { display: block; }
.anim-off *, .anim-off *::before, .anim-off *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------- splash ---------- */
#splash {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: var(--bg); transition: opacity .45s ease, visibility .45s;
}
#splash.done { opacity: 0; visibility: hidden; }
.splash-in { display: grid; justify-items: center; gap: 18px; }
.splash-mark { animation: pop .7s cubic-bezier(.2, .9, .3, 1.2) both; }
.splash-word { font-family: var(--font-display); font-weight: 700; letter-spacing: .22em; font-size: 20px; animation: rise .6s .25s both; }
.splash-word b { color: var(--accent); font-weight: 700; }
.splash-dev { color: var(--fg3); font-size: 12px; letter-spacing: .08em; animation: rise .6s .45s both; }
.splash-bar { width: 120px; height: 3px; border-radius: 3px; background: var(--surface2); overflow: hidden; animation: rise .6s .45s both; }
.splash-bar i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
@keyframes pop { from { transform: scale(.6) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }

/* ---------- shell ---------- */
#app { height: 100%; display: flex; flex-direction: column; max-width: 1040px; margin: 0 auto; position: relative; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px 8px; flex: none;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-word { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .16em; white-space: nowrap; }
.brand-word b { color: var(--accent); font-weight: 700; }
.brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand-dev { font-size: 11px; font-weight: 600; color: var(--fg2); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); transition: background .15s, transform .1s;
}
.iconbtn:active { transform: scale(.94); }
.iconbtn.plain { background: none; border-color: transparent; }
.offline-pill {
  margin: 0 16px 6px; padding: 6px 12px; border-radius: 99px; font-size: 12.5px; background: var(--surface2);
  color: var(--warn); display: flex; gap: 8px; align-items: center; flex: none;
}
#main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 0 20px; scroll-behavior: smooth; }
.screen { padding-inline: 16px; animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.nav {
  display: flex; flex: none; background: var(--bg2); border-top: 1px solid var(--line); min-height: var(--nav-h);
}
.nav button {
  flex: 1; display: grid; place-items: center; align-content: center; gap: 3px; color: var(--fg3);
  font-size: 11px; font-weight: 600; letter-spacing: .02em; position: relative; transition: color .15s;
}
.nav button.on { color: var(--accent); }
.nav button.on::before { content: ''; position: absolute; top: -1px; width: 28px; height: 3px; border-radius: 0 0 4px 4px; background: var(--accent); }
.nav .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 10px; display: grid; place-items: center; }

/* ---------- type + common ---------- */
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.h-screen { font-size: 22px; margin: 8px 0 14px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
.sec-head h2 { font-size: 15px; letter-spacing: 0; }
.muted { color: var(--fg2); }
.faint { color: var(--fg3); }
.small { font-size: 12.5px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px;
  border-radius: var(--r-ctl); font-weight: 700; background: var(--surface2); border: 1px solid var(--line); transition: transform .1s, filter .15s; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; color: var(--fg2); display: inline-flex; align-items: center; gap: 6px;
}
.chip.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; height: 34px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--fg2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--surface2); color: var(--fg); box-shadow: 0 1px 0 var(--line); }
.seg .n { font-size: 11px; background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 0 6px; }
.field {
  display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: var(--r-ctl);
  background: var(--surface); border: 1px solid var(--line); color: var(--fg3);
}
.field:focus-within { border-color: var(--accent); }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); height: 100%; }
.field input::placeholder { color: var(--fg3); }
.row-tools { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px; }
.row-tools .field { flex: 1; min-width: 0; }
select.sel {
  height: 46px; border-radius: var(--r-ctl); background: var(--surface); border: 1px solid var(--line); padding: 0 10px; color: var(--fg);
}
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 44px 24px; color: var(--fg2); }
.empty .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--surface); color: var(--accent); }
.empty .btnrow { width: 100%; max-width: 360px; }
.empty b { color: var(--fg); font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.skel { background: linear-gradient(100deg, var(--surface) 30%, var(--surface2) 50%, var(--surface) 70%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-card); }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- cards ---------- */
.rail { display: flex; gap: 12px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 8px; scroll-snap-type: x proximity; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail .card { width: 150px; flex: none; scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; }
.card { position: relative; text-align: left; display: block; min-width: 0; cursor: pointer; }
.thumb { position: relative; aspect-ratio: 16 / 10; border-radius: var(--r-card); overflow: hidden; background: var(--surface2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
.card:active .thumb img { transform: scale(1.04); }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, .85); }
.tag {
  position: absolute; left: 7px; top: 7px; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 800;
  letter-spacing: .04em; background: rgba(8, 12, 22, .72); color: #fff; backdrop-filter: blur(4px);
}
.tag.acc { background: var(--accent); color: var(--on-accent); }
.dur { position: absolute; right: 7px; bottom: 7px; padding: 1px 6px; border-radius: 6px; font-size: 11px; font-weight: 700; background: rgba(8, 12, 22, .72); color: #fff; font-variant-numeric: tabular-nums; }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, .25); }
.prog i { display: block; height: 100%; background: var(--accent); }
.card .meta { padding: 8px 2px 0; display: flex; gap: 6px; align-items: flex-start; }
.card .meta > div { flex: 1; min-width: 0; }
.card .t { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .s { color: var(--fg3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more { width: 28px; height: 28px; margin: -3px -6px 0 0; border-radius: 50%; display: grid; place-items: center; color: var(--fg3); }
.more:active { background: var(--surface2); }
.hero { display: flex; gap: 12px; overflow-x: auto; margin-inline: -16px; padding: 4px 16px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hero::-webkit-scrollbar { display: none; }
.slide { position: relative; flex: none; width: min(88%, 520px); aspect-ratio: 16 / 10; border-radius: 20px; overflow: hidden; scroll-snap-align: center; background: var(--surface2); box-shadow: var(--shadow); cursor: pointer; }
.slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(5, 8, 16, .92)); }
.slide .in { position: absolute; inset: auto 16px 14px 16px; z-index: 1; color: #fff; display: grid; gap: 8px; }
.slide h3 { font-size: 19px; }
.slide .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: rgba(255, 255, 255, .8); }
.slide .btns { display: flex; gap: 8px; }
.listrow { display: flex; gap: 12px; align-items: center; padding: 8px; margin-inline: -8px; border-radius: 14px; cursor: pointer; min-width: 0; }
.listrow:active { background: var(--surface); }
.listrow .thumb { width: 118px; flex: none; border-radius: 10px; }
.listrow .info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.listrow .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listrow .s { color: var(--fg3); font-size: 12.5px; }
.list { display: grid; gap: 4px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--surface2); color: var(--fg2); }
.pill.good { color: var(--good); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet-back { position: absolute; inset: 0; background: var(--scrim); animation: fadein .2s both; }
@keyframes fadein { from { opacity: 0; } }
.sheet {
  position: relative; width: min(100%, 640px); max-height: 88%; display: flex; flex-direction: column; background: var(--bg2);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  animation: up .28s cubic-bezier(.2, .9, .3, 1) both; padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.full { height: 100%; max-height: 100%; border-radius: 0; width: min(100%, 1040px); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; flex: none; }
.sheet-head h2 { flex: 1; font-size: 16px; }
.sheet-body { overflow-y: auto; padding: 4px 16px 18px; display: grid; gap: 10px; align-content: start; }
.act { display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 6px; border-radius: 12px; font-weight: 600; width: 100%; text-align: left; }
.act:active { background: var(--surface); }
.act.danger { color: var(--bad); }
.act .ic { color: var(--fg2); } .act.danger .ic { color: var(--bad); }
.act small { margin-left: auto; color: var(--fg3); font-weight: 500; }
.formrow { display: grid; gap: 6px; }
.formrow label { font-size: 12.5px; color: var(--fg2); font-weight: 600; }
.textin { height: 46px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); padding: 0 14px; color: var(--fg); width: 100%; }
.textin:focus { outline: none; border-color: var(--accent); }
.btnrow { display: flex; gap: 10px; } .btnrow .btn { flex: 1; }
.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; max-width: 480px; padding: 11px 16px; border-radius: 14px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; animation: rise .25s both; }
.toast button { color: var(--accent); font-weight: 800; filter: saturate(1.2) brightness(.85); }

/* ---------- detail ---------- */
.d-hero { position: relative; margin: 0 -16px; aspect-ratio: 16 / 9; background: var(--surface2); }
.d-hero img { width: 100%; height: 100%; object-fit: cover; }
.d-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, var(--bg2)); }
.d-title { font-size: 22px; margin-top: 4px; }
.d-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--fg2); font-size: 13px; }
.d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.d-actions .wide { grid-column: 1 / -1; }
.d-actions .primary { height: 50px; }
.qgrid { display: grid; gap: 8px; }
.qrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.qrow.on { border-color: var(--accent); }
.qrow b { font-family: var(--font-display); font-weight: 600; font-size: 14px; min-width: 56px; }
.qrow .sz { margin-left: auto; color: var(--fg3); font-size: 13px; font-variant-numeric: tabular-nums; }
.qrow .ck { color: var(--accent); }

/* ---------- downloads / progress ---------- */
.dl { display: grid; gap: 10px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.dl-top { display: flex; gap: 12px; align-items: center; min-width: 0; }
.dl-top .thumb { width: 92px; flex: none; border-radius: 10px; }
.dl-top .info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.bar { height: 6px; border-radius: 6px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s linear; }
.bar.good i { background: var(--good); }
.dl-stats { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--fg2); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.dl-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- settings ---------- */
.set-sec { margin-top: 16px; }
.set-sec > h3 { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg3); margin: 0 4px 8px; font-family: var(--font-body); font-weight: 800; }
.code { margin: 0; padding: 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; font: 12px/1.5 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; color: var(--fg); overflow-x: auto; white-space: pre; user-select: text; }
.set-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.set-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; }
.set-row .lab { flex: 1; min-width: 0; }
.set-row .lab b { display: block; font-weight: 700; }
.set-row .lab span { color: var(--fg3); font-size: 12.5px; }
.switch { width: 48px; height: 28px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg2); transition: transform .2s, background .2s; }
.switch.on { background: var(--accent); border-color: transparent; }
.switch.on::after { transform: translateX(20px); background: var(--on-accent); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--line); }
.sw.on { border-color: var(--bg2); outline: 2px solid var(--fg); }
.cust-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.cust-row .lab { flex: 1; font-weight: 700; }
.cust-row.off .lab { color: var(--fg3); text-decoration: line-through; }

/* ---------- player ---------- */
.player { position: fixed; inset: 0; z-index: 80; background: #000; color: var(--pl-fg); user-select: none; -webkit-user-select: none; touch-action: none; font-family: var(--font-body); }
.player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.player video::cue { background: rgba(0, 0, 0, .66); color: #fff; font-size: 1.05em; }
.pl-gesture { position: absolute; inset: 0; }
.pl-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; transition: opacity .25s; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.pl-ui > * { pointer-events: auto; }
.player.ui-hidden .pl-ui { opacity: 0; }
.player.ui-hidden .pl-ui > * { pointer-events: none; }

    if (opt.action) t.appendChild(h('button', { onclick: () => { try { opt.action.fn(); } finally { t.remove(); } } }, opt.action.label));
    toastBox.appendChild(t);
    while (toastBox.children.length > 3) toastBox.firstChild.remove();
    setTimeout(() => t.remove(), opt.ms || 3200);
  };

  /* ---------- sheets ---------- */
  const sheets = [];
  RAW.sheet = {
    open({ title, body, full = false, onClose, right }) {
      const back = h('div', { class: 'sheet-back' });
      const bodyEl = h('div', { class: 'sheet-body' });
      const sheetEl = h('div', { class: 'sheet' + (full ? ' full' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title || 'Dialog' },
        h('div', { class: 'sheet-head' }, h('h2', {}, title || ''), right || null,
          h('button', { class: 'iconbtn plain', 'aria-label': 'Close', onclick: () => api.close() }, icon('x', 22))),
        bodyEl);
      const wrap = h('div', { class: 'sheet-wrap' }, back, sheetEl);
      let closed = false;
      const api = {
        el: bodyEl, wrap,
        close() { if (closed) return; closed = true; wrap.remove(); const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1); if (onClose) onClose(); },
        set(content) { bodyEl.replaceChildren(...[].concat(content).filter(Boolean)); },
        setTitle(t) { $('h2', sheetEl).textContent = t; },
      };
      back.addEventListener('click', () => api.close());
      api.set(body);
      document.body.appendChild(wrap);
      sheets.push(api);
      return api;
    },
    actions(title, list) {
      const s = RAW.sheet.open({ title });
      s.set(list.filter(Boolean).map(a => h('button', { class: 'act' + (a.danger ? ' danger' : ''), onclick: () => { s.close(); a.run && a.run(); } },
        a.icon ? icon(a.icon, 22) : null, h('span', {}, a.label), a.hint ? h('small', {}, a.hint) : null)));
      return s;
    },
    confirm({ title, text, ok = 'Confirm', danger = false, onOk }) {
      const s = RAW.sheet.open({ title });
      s.set([h('p', { class: 'muted', style: { margin: 0 } }, text),
        h('div', { class: 'btnrow' },
          h('button', { class: 'btn', onclick: () => s.close() }, 'Cancel'),
          h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => { s.close(); onOk && onOk(); } }, ok))]);
      return s;
    },
    prompt({ title, label, value = '', ok = 'Save', placeholder = '', onOk }) {
      const inp = h('input', { class: 'textin', id: 'prompt-in', value, placeholder, maxlength: 60, autocomplete: 'off' });
      const s = RAW.sheet.open({ title });
      const submit = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } s.close(); onOk && onOk(v); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      s.set([h('div', { class: 'formrow' }, h('label', { for: 'prompt-in' }, label || title), inp),
        h('div', { class: 'btnrow' }, h('button', { class: 'btn', onclick: () => s.close() }, 'Cancel'), h('button', { class: 'btn primary', onclick: submit }, ok))]);
      setTimeout(() => { inp.focus(); inp.select(); }, 60);
      return s;
    },
    closeAll() { sheets.slice().forEach(s => s.close()); },
  };

  /* ---------- safety net: never crash on stray errors ---------- */
  let lastErr = 0;
  function soft(e) {
    console.warn('RAW Stream caught:', e);
    if (Date.now() - lastErr > 4000) { lastErr = Date.now(); RAW.toast('Something went wrong. RAW Stream is still running.'); }
  }
  window.addEventListener('error', e => { if (e.target && e.target !== window) return; soft(e.error || e.message); });
  window.addEventListener('unhandledrejection', e => { soft(e.reason); e.preventDefault(); });
})();

/* ===== MODULE: data =====
   Catalog sources, item lookup, favorites, playlists, watch history, search history,
   and the local-video library (files picked from the phone).
   To add a catalog source: RAW.sources.push({id, name, load: async () => [items]}).
*/
(function () {
  const { h, hashStr, qLabel } = RAW.util;
  const { store, bus, db } = RAW;

  /* ---------- demo catalog (original clips generated for RAW Stream, free to use) ---------- */
  const rend = (id, sizes) => Object.fromEntries(Object.entries(sizes).map(([q, size]) => [q, { url: `media/${id}_${q}.mp4`, size, codec: 'avc1.640028' }]));

  const DEMO = [

      desc: 'Slow bands of colour drift across the frame in an ambient study of light. A calm test clip with a soft tremolo tone.',

    { id: 'c:bloom', title: 'Life Bloom', type: 'movie', year: 2025, duration: 10, rating: 'U', featured: true, trending: true, added: 20251101,

      tags: ['Simulation', 'Motion'], thumb: 'media/bloom.jpg', downloadable: true, qualities: rend('bloom', { 480: 2337155, 720: 4190451, 1080: 5412619 }), subs: subs('bloom') },
    { id: 'c:rain', title: 'Cell Rain', type: 'series', year: 2024, duration: 10, rating: 'U', ep: 'S1 · E2', added: 20240601,

  const catalog = new Map();
  async function loadSources() {
    for (const s of RAW.sources) {
      try { (await s.load()).forEach(it => catalog.set(it.id, Object.assign({ kind: 'catalog', source: s.id }, it))); }
      catch (e) { console.warn('Source failed', s.id, e); RAW.toast(`Could not load "${s.name}"`); }
    }

  /* ---------- local library ---------- */

  const thumbMem = new Map();        // id -> data URL
  const VIDEO_EXT = /\.(mp4|m4v|mkv|webm|mov|avi|3gp|ts|mpg|mpeg|ogv|flv|wmv)$/i;
  const Local = {
    all() { return [...local.values()]; },
    folders() { return store.get('folders', []); },
    async load() {
      try {
        const rows = await db.all('local');
        rows.forEach(({ v }) => local.set(v.id, Object.assign(v, { kind: 'local', type: 'local', file: null })));

    },
    persist(it) {

    isVideo(f) { return (f.type && f.type.startsWith('video/')) || VIDEO_EXT.test(f.name); },
    /* Add files. `onProgress(done,total)` is optional. Returns number of videos added or re-linked. */

        const id = 'l:' + hashStr(f.name + '|' + f.size + '|' + f.lastModified);

        it.file = f;
        local.set(id, it);

        added++;
        if (scanned % 5 === 0) await new Promise(r => setTimeout(r, 0));

      bus.emit('local:change');

    },
    /* Read duration/size from the file; failure just means "format not decodable here". */
    probe(it) {
      return new Promise(res => {
        const v = document.createElement('video'); const url = URL.createObjectURL(it.file);
        let done = false;
        const fin = ok => { if (done) return; done = true; if (ok) { it.duration = v.duration || 0; it.height = v.videoHeight || 0; } else it.unsupported = true; URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); res(); };
        v.preload = 'metadata'; v.muted = true;

    remove(id) { local.delete(id); db.del('local', id); db.del('thumbs', id); thumbMem.delete(id); bus.emit('local:change'); },
    removeFolder(name) {

      store.set('folders', Local.folders().filter(f => f.name !== name)); bus.emit('local:change'); bus.emit('local:folders');

  };
  function folderAdd(files) {
    const names = new Set(files.map(f => f.webkitRelativePath && f.webkitRelativePath.split('/')[0]).filter(Boolean));
    if (!names.size) return false;
    const cur = Local.folders();
    names.forEach(n => { const c = files.filter(f => f.webkitRelativePath && f.webkitRelativePath.startsWith(n + '/') && Local.isVideo(f)).length; const e = cur.find(x => x.name === n); if (e) { e.count = c; e.scanned = Date.now(); } else cur.push({ name: n, count: c, scanned: Date.now() }); });
    store.set('folders', cur);

  /* local thumbnails: one at a time, cached in IndexedDB so scrolling stays smooth */
  let thumbQueue = Promise.resolve();
  Local.thumb = function (it) {
    if (thumbMem.has(it.id)) return Promise.resolve(thumbMem.get(it.id));
    return db.get('thumbs', it.id).then(cached => {
      if (cached) { thumbMem.set(it.id, cached); return cached; }
      if (!it.file || it.unsupported) return null;
      thumbQueue = thumbQueue.then(() => makeThumb(it)).catch(() => null);
      return thumbQueue;
    }).catch(() => null);
  };
  function makeThumb(it) {
    return new Promise(res => {
      const v = document.createElement('video'); const url = URL.createObjectURL(it.file);
      let done = false;
      const fin = data => { if (done) return; done = true; URL.revokeObjectURL(url); v.removeAttribute('src'); v.load(); if (data) { thumbMem.set(it.id, data); db.put('thumbs', it.id, data).catch(() => { }); } res(data); };
      v.muted = true; v.preload = 'auto'; v.playsInline = true;
      v.onloadeddata = () => { try { v.currentTime = Math.min(Math.max(v.duration * 0.1, 0.5), 8); } catch { fin(null); } };

        try { const c = document.createElement('canvas'); c.width = 320; c.height = Math.round(320 * (v.videoHeight || 9) / (v.videoWidth || 16)); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); fin(c.toDataURL('image/jpeg', 0.7)); } catch { fin(null); }
      };
      v.onerror = () => fin(null);
      setTimeout(() => fin(null), 8000);
      v.src = url;
    });
  }
  Local.clearThumbs = async function () { thumbMem.clear(); await db.clear('thumbs'); };

  /* ---------- items ---------- */
  const Items = {
    byId(id) { return catalog.get(id) || local.get(id) || null; },
    catalog() { return [...catalog.values()]; },
    /* Replace everything that came from one source (used by repositories). */
    setSource(sourceId, items) {
      for (const [k, v] of catalog) if (v.source === sourceId) catalog.delete(k);
      (items || []).forEach(it => catalog.set(it.id, Object.assign({}, it, { kind: 'catalog', source: sourceId })));
      bus.emit('lib:change');
    },
    local() { return Local.all(); },
    all() { return [...Items.catalog(), ...Items.local()]; },
    /* highest height this item can offer */
    maxQ(it) { return it.kind === 'local' ? (it.height || 0) : Math.max(0, ...Object.keys(it.qualities || {}).map(Number)); },
    qualities(it) { return it.kind === 'local' ? (it.height ? [it.height] : []) : Object.keys(it.qualities || {}).map(Number).sort((a, b) => b - a); },
    typeLabel(it) { return { movie: 'Movie', series: 'Series', tv: 'TV Show', local: 'My video' }[it.type] || 'Video'; },
  };

  /* ---------- favorites ---------- */
  const Fav = {
    list() { return store.get('favs', []); },
    has(id) { return Fav.list().includes(id); },
    toggle(id) {

    list() { return store.get('playlists', []); },
    save(l) { store.set('playlists', l); bus.emit('lib:change'); },
    create(name) { const l = Playlists.list(); const p = { id: 'p' + Date.now().toString(36), name, items: [] }; l.push(p); Playlists.save(l); return p; },
    rename(id, name) { const l = Playlists.list(); const p = l.find(x => x.id === id); if (p) { p.name = name; Playlists.save(l); } },
    remove(id) { Playlists.save(Playlists.list().filter(p => p.id !== id)); },
    add(id, itemId) { const l = Playlists.list(); const p = l.find(x => x.id === id); if (p && !p.items.includes(itemId)) { p.items.push(itemId); Playlists.save(l); return true; } return false; },
    removeItem(id, itemId) { const l = Playlists.list(); const p = l.find(x => x.id === id); if (p) { p.items = p.items.filter(i => i !== itemId); Playlists.save(l); } },
    move(id, idx, dir) { const l = Playlists.list(); const p = l.find(x => x.id === id); if (!p) return; const j = idx + dir; if (j < 0 || j >= p.items.length) return; [p.items[idx], p.items[j]] = [p.items[j], p.items[idx]]; Playlists.save(l); },
    get(id) { return Playlists.list().find(p => p.id === id); },
  };

  /* ---------- watch history ---------- */
  const History = {
    map() { return store.get('history', {}); },
    get(id) { return History.map()[id] || null; },
    touch(id, pos, dur, done) {
      if (!id || !isFinite(pos)) return;

      m[id] = { pos: done ? 0 : pos, dur: dur || prev.dur || 0, t: Date.now(), done: !!done || (dur && pos / dur > 0.95) || false };
      store.set('history', m);
    },
    pct(id) { const e = History.get(id); return e && e.dur ? Math.min(1, (e.done ? 1 : e.pos / e.dur)) : 0; },
    recent() { return Object.entries(History.map()).sort((a, b) => b[1].t - a[1].t).map(([id, e]) => ({ id, ...e })).filter(e => Items.byId(e.id)); },
    resumable() { return History.recent().filter(e => !e.done && e.pos > 3 && e.dur && e.pos < e.dur - 3); },
    remove(id) { const m = History.map(); delete m[id]; store.set('history', m); bus.emit('lib:change'); },
    clear() { store.set('history', {}); bus.emit('lib:change'); },
  };

  /* ---------- search history ---------- */
  const SearchHist = {
    list() { return store.get('searches', []); },
    add(q) { q = q.trim(); if (q.length < 2) return; const l = SearchHist.list().filter(x => x.toLowerCase() !== q.toLowerCase()); l.unshift(q); store.set('searches', l.slice(0, 12)); },
    remove(q) { store.set('searches', SearchHist.list().filter(x => x !== q)); },
    clear() { store.set('searches', []); },
  };

  /* ---------- quality choice for a catalog item ---------- */
  const decodeCache = new Map();
  async function canDecode(item, q) {
    const r = item.qualities[q]; if (!r) return false;
    const webm = /\.webm(\?|#|$)/i.test(r.url || '');
    const key = (r.codec || '') + (webm ? 'w' : 'm') + q; if (decodeCache.has(key)) return decodeCache.get(key);
    let ok = true;
    try {
      if (navigator.mediaCapabilities && navigator.mediaCapabilities.decodingInfo) {
        const w = Math.round(q * 16 / 9);
        const info = await navigator.mediaCapabilities.decodingInfo({ type: 'file', video: { contentType: `video/${webm ? 'webm' : 'mp4'}; codecs="${r.codec || (webm ? 'vp09.00.40.08' : 'avc1.640028')}"`, width: w, height: q, bitrate: Math.max(300000, Math.round((r.size || 1e6) * 8 / (item.duration || 10))), framerate: 24 } });
        ok = !!info.supported;
      }
    } catch { ok = true; }
    decodeCache.set(key, ok); return ok;
  }
  /* Highest quality that the source offers and this device can decode. Only a slow or data-saver
     connection lowers the pick. If decoding fails at runtime the player steps down (see player.js). */
  async function pickAuto(item) {
    const qs = Items.qualities(item); if (!qs.length) return null;
    let cap = Infinity;   // no screen-size cap: pick the best the device can decode
    const c = navigator.connection;
    if (c) { if (c.saveData || ['slow-2g', '2g'].includes(c.effectiveType)) cap = Math.min(cap, 480); else if (c.effectiveType === '3g') cap = Math.min(cap, 720); }
    for (const q of qs) if (q <= cap && await canDecode(item, q)) return q;
    return qs[qs.length - 1];
  }
  function sizeOf(item, q) { return item.qualities && item.qualities[q] ? item.qualities[q].size : item.size || 0; }

  RAW.data = { Items, Fav, Playlists, History, SearchHist, Local, loadSources, pickAuto, canDecode, sizeOf, qLabel };
  void h;
})();

/* ===== MODULE: repos =====
   Repositories: a link to a JSON file that lists videos. Add one in Settings > Video sources and its
   videos appear in Home, Search and Library next to everything else.

   RAW Stream ships no videos and no scrapers. A repository is plain data that the owner publishes.
   Rules enforced here:
     - the link must be https (http only for localhost, for testing)
     - every video must name a license; downloads need  "downloadable": true  AND a license
     - only http(s) links are kept; text is never run as code
   File format: see FORMAT_EXAMPLE below, also shown inside the app (Settings > Video sources > Format).
*/
(function () {
  const { h, icon, hashStr, fmtAgo } = RAW.util;
  const { store, bus } = RAW;

  const KEY = 'repos', KEEP = 'repokeep', CACHE = 'repocache:';
  const MAX_REPOS = 20, MAX_ITEMS = 2000, MAX_BYTES = 5 * 1024 * 1024, TIMEOUT = 12000;

  const FORMAT_EXAMPLE = `{
  "raw": 1,
  "name": "My videos",
  "items": [
    {
      "id": "lesson-1",
      "title": "Lesson 1",
      "type": "series",
      "year": 2026,
      "duration": 600,
      "description": "Short text about the video",
      "license": "My own video",
      "downloadable": true,
      "thumb": "lesson-1.jpg",
      "qualities": {
        "480": { "url": "lesson-1-480.mp4", "size": 18000000 },
        "720": { "url": "lesson-1-720.mp4", "size": 40000000 },
        "1080": "lesson-1-1080.mp4"
      },
      "subtitles": [ { "lang": "bn", "label": "বাংলা", "url": "lesson-1.bn.vtt" } ]
    }
  ]
}`;

  const state = new Map();   // repoId -> { status: 'loading' | 'ok' | 'error', error, count, skipped, at }
  const userErr = (msg, code) => { const e = new Error(code || 'repo'); e.userMsg = msg; return e; };

  /* ---------- link checks ---------- */
  function cleanUrl(input) {
    let u;
    try { u = new URL(String(input || '').trim()); } catch { throw userErr('That does not look like a link. Paste the full link, starting with https://'); }
    const local = ['localhost', '127.0.0.1', '[::1]'].includes(u.hostname);
    if (u.protocol !== 'https:' && !(u.protocol === 'http:' && local)) throw userErr('Use a secure link that starts with https://');
    if (/^(www\.)?github\.com$/i.test(u.hostname) && !/\.json$/i.test(u.pathname)) throw userErr('This is a GitHub page, not the repository file. Paste the link to the .json file (for example https://yourname.github.io/yourrepo/repo.json).');
    u.hash = '';
    return u;
  }
  const safeHref = (v, base, allowData) => {
    if (typeof v !== 'string' || !v.trim() || v.length > 2000) return '';
    if (allowData && /^data:text\/vtt[;,]/i.test(v.trim())) return v.trim();
    try { const u = new URL(v.trim(), base); return (u.protocol === 'https:' || (u.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(u.hostname))) ? u.href : ''; } catch { return ''; }
  };
  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const num = v => (typeof v === 'number' && isFinite(v) && v >= 0 ? v : 0);

  /* Poster used when a video has no thumbnail: first letter on a dark tile (a data: image, no request). */
  const placeholder = title => 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="#1e2742"/><text x="160" y="118" font-family="sans-serif" font-size="84" font-weight="700" text-anchor="middle" fill="#6e7896">' + (Array.from(title)[0] || '?').toUpperCase().replace(/[<>&"']/g, '') + '</text></svg>');

  /* ---------- turn a repository file into catalog items ---------- */
  function normalize(json, baseUrl, repoId) {
    if (!json || typeof json !== 'object' || !Array.isArray(json.items)) throw userErr('This file is not a RAW Stream repository. It needs a list called "items". Open Format to see an example.');
    const out = []; let skipped = 0;
    const repoName = str(json.name, 60) || new URL(baseUrl).hostname;
    json.items.slice(0, MAX_ITEMS).forEach((raw, idx) => {
      try {
        if (!raw || typeof raw !== 'object') throw 0;
        const title = str(raw.title, 120); if (!title) throw 0;
        const quals = {};
        const q = raw.qualities && typeof raw.qualities === 'object' ? raw.qualities : {};
        for (const [k, v] of Object.entries(q)) {
          const height = parseInt(k, 10); if (!(height >= 144 && height <= 4320)) continue;
          const entry = typeof v === 'string' ? { url: v } : (v && typeof v === 'object' ? v : null); if (!entry) continue;
          const url = safeHref(entry.url, baseUrl); if (!url) continue;
          quals[height] = { url, size: num(entry.size), codec: str(entry.codec, 40) || undefined };
        }
        if (!Object.keys(quals).length) throw 0;
        const license = str(raw.license, 80);
        const type = ['movie', 'series', 'tv'].includes(raw.type) ? raw.type : 'movie';
        const subs = (Array.isArray(raw.subtitles) ? raw.subtitles : []).slice(0, 8).map(s => ({ lang: str(s && s.lang, 8) || 'en', label: str(s && s.label, 30) || 'Subtitles', url: safeHref(s && s.url, baseUrl, true) })).filter(s => s.url);
        const idPart = str(String(raw.id == null ? '' : raw.id), 80) || hashStr(title + Object.values(quals)[0].url);
        out.push({
          id: 'r:' + repoId + ':' + idPart, title, type, year: num(raw.year) || '', duration: num(raw.duration), rating: str(raw.rating, 8),
          ep: str(raw.episode, 16), desc: str(raw.description, 600), tags: (Array.isArray(raw.tags) ? raw.tags : []).slice(0, 6).map(t => str(t, 24)).filter(Boolean),
          thumb: safeHref(raw.thumb, baseUrl) || placeholder(title), qualities: quals, subs, featured: raw.featured === true, trending: raw.trending === true,
          added: num(raw.added) || (20000000 + idx), license, downloadable: raw.downloadable === true && !!license, repo: { id: repoId, name: repoName },
        });
      } catch { skipped++; }
    });
    return { name: repoName, items: out, skipped };
  }

  /* ---------- fetch ---------- */
  async function fetchRepo(url) {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), TIMEOUT);
    try {
      const res = await fetch(url, { cache: 'no-cache', credentials: 'omit', signal: ctrl.signal, headers: { Accept: 'application/json' } });
      if (!res.ok) throw userErr('The repository answered ' + res.status + '. Check that the link is right and the file is public.');
      const text = await res.text();
      if (text.length > MAX_BYTES) throw userErr('This repository file is too large (over 5 MB).');
      try { return JSON.parse(text); } catch { throw userErr('This link does not hold a repository file. The JSON could not be read.'); }
    } catch (e) {
      if (e && e.userMsg) throw e;
      if (e && e.name === 'AbortError') throw userErr('The repository took too long to answer. Try again on a better connection.');
      throw userErr(navigator.onLine === false ? 'No internet connection.' : 'Could not reach the repository. Check the link and your internet. The host must also allow other websites to read the file (CORS). Previews inside other apps can block outside links.');
    } finally { clearTimeout(t); }
  }

  const R = RAW.repos = {
    list() { return store.get(KEY, []); },
    state(id) { return state.get(id) || { status: 'ok', count: 0 }; },
    format() { return FORMAT_EXAMPLE; },

    /* Add by link. Throws an error with .userMsg when the link cannot be used. */
    async add(input) {
      const u = cleanUrl(input), url = u.href;
      const list = R.list();
      if (list.some(r => r.url === url)) throw userErr('This repository is already added.');
      if (list.length >= MAX_REPOS) throw userErr('You can add up to ' + MAX_REPOS + ' repositories. Remove one first.');
      const id = hashStr(url);
      const parsed = normalize(await fetchRepo(url), url, id);
      if (!parsed.items.length) throw userErr('The file was read, but it has no playable videos. Every video needs a title and at least one quality with a link.');
      const repo = { id, url, name: parsed.name, addedAt: Date.now() };
      store.set(KEY, list.concat(repo));
      R._apply(repo, parsed);
      return { repo, count: parsed.items.length, skipped: parsed.skipped };
    },

    _apply(repo, parsed) {
      RAW.data.Items.setSource('repo:' + repo.id, parsed.items);
      state.set(repo.id, { status: 'ok', count: parsed.items.length, skipped: parsed.skipped, at: Date.now() });
      try { const s = JSON.stringify({ at: Date.now(), name: parsed.name, items: parsed.items }); if (s.length < 1500000) store.set(CACHE + repo.id, JSON.parse(s)); } catch { /* cache is optional */ }
      const list = R.list(); const r = list.find(x => x.id === repo.id);
      if (r && r.name !== parsed.name) { r.name = parsed.name; store.set(KEY, list); }
      bus.emit('repos:change');
    },

    /* Reload one repository. Keeps the last good copy if the update fails. */
    async refresh(id) {
      const repo = R.list().find(r => r.id === id); if (!repo) return;
      const prev = state.get(id) || {}; state.set(id, Object.assign({}, prev, { status: 'loading' })); bus.emit('repos:change');
      try {
        const parsed = normalize(await fetchRepo(repo.url), repo.url, id);
        if (!parsed.items.length) throw userErr('The file has no playable videos any more.');
        R._apply(repo, parsed);
      } catch (e) {
        state.set(id, Object.assign({}, prev, { status: 'error', error: e.userMsg || 'Could not update this repository.' }));
        bus.emit('repos:change');
      }
    },
    refreshAll() { return Promise.all(R.list().map(r => R.refresh(r.id))); },

    /* Remove a repository. Videos you downloaded from it stay playable on this phone. */
    remove(id) {
      const Items = RAW.data.Items, D = RAW.downloads;
      const keepers = Items.catalog().filter(i => i.source === 'repo:' + id && D.done(i.id));
      if (keepers.length) { const keep = store.get(KEEP, []).filter(k => !keepers.some(n => n.id === k.id)).concat(keepers.map(k => Object.assign({}, k, { downloadable: false })));
        store.set(KEEP, keep); Items.setSource('repo:keep', keep); }
      Items.setSource('repo:' + id, []);
      store.set(KEY, R.list().filter(r => r.id !== id));
      try { localStorage.removeItem('raw:' + CACHE + id); } catch { /* */ }
      state.delete(id); bus.emit('repos:change');
    },

    /* Called once at startup: show cached videos at once, then update in the background. */
    init() {
      const Items = RAW.data.Items;
      R.list().forEach(r => {
        const c = store.get(CACHE + r.id, null);
        if (c && Array.isArray(c.items)) { Items.setSource('repo:' + r.id, c.items); state.set(r.id, { status: 'ok', count: c.items.length, at: c.at }); }
      });
      const keep = store.get(KEEP, []); if (keep.length) Items.setSource('repo:keep', keep);
      const go = () => { if (navigator.onLine !== false && R.list().length) R.refreshAll(); };
      go(); addEventListener('online', go);
    },
  };

  /* ---------- Settings card ---------- */
  const host = u => { try { return new URL(u).hostname; } catch { return u; } };

  function formatSheet() {
    const pre = h('pre', { class: 'code' }, FORMAT_EXAMPLE);
    RAW.sheet.open({ title: 'Repository format', body: [
      h('p', { class: 'muted small', style: { margin: 0 } }, 'A repository is one JSON file that you or someone you trust publishes. Links inside it can be full links or paths next to the file.'),
      h('ul', { class: 'muted small', style: { margin: '10px 0', paddingLeft: '18px', lineHeight: '1.6' } },
        h('li', {}, 'Every video needs a title, a license, and at least one quality with a link.'),
        h('li', {}, 'Downloads are allowed only when "downloadable" is true and a license is given.'),
        h('li', {}, 'Qualities are the video height: 480, 720, 1080, 1440, 2160 or 4320.'),
        h('li', {}, 'Use MP4 (H.264) or WebM files. The host must allow other websites to read them (CORS).')),
      pre,
      h('div', { class: 'btnrow' }, h('button', { class: 'btn primary', onclick: async () => {
        try { await navigator.clipboard.writeText(FORMAT_EXAMPLE); RAW.toast('Example copied'); }
        catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); RAW.toast('Select and copy the text'); }
      } }, 'Copy example'))] });
  }

  function addSheet() {
    const inp = h('input', { class: 'textin', id: 'repo-url', type: 'url', inputmode: 'url', placeholder: 'https://example.com/repo.json', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    const msg = h('p', { class: 'small', style: { margin: '8px 0 0', minHeight: '1.2em', color: 'var(--bad)' }, role: 'alert' });
    const go = h('button', { class: 'btn primary' }, 'Add');
    const s = RAW.sheet.open({ title: 'Add repository' });
    const submit = async () => {
      msg.textContent = ''; go.disabled = true; go.textContent = 'Checking…';
      try {
        const r = await R.add(inp.value);
        s.close(); RAW.toast(`Added "${r.repo.name}" · ${r.count} video${r.count === 1 ? '' : 's'}`);
      } catch (e) { msg.textContent = e.userMsg || 'Could not add this repository.'; go.disabled = false; go.textContent = 'Add'; }
    };
    go.addEventListener('click', submit); inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    s.set([h('div', { class: 'formrow' }, h('label', { for: 'repo-url' }, 'Repository link'), inp), msg,
      h('p', { class: 'faint small', style: { margin: '10px 0 0' } }, 'Only add repositories whose videos you own or have permission to watch. RAW Stream does not provide videos.'),
      h('div', { class: 'btnrow' }, h('button', { class: 'btn', onclick: () => s.close() }, 'Cancel'), go)]);
    setTimeout(() => inp.focus(), 60);
  }

  R.card = function (repaint) {
    const row = (label, desc, right) => h('div', { class: 'set-row' }, h('div', { class: 'lab' }, h('b', {}, label), desc ? h('span', {}, desc) : null), right);
    const list = R.list();
    const rows = list.map(r => {
      const st = R.state(r.id);
      const status = st.status === 'loading' ? 'Updating…' : st.status === 'error' ? st.error : (st.count + ' video' + (st.count === 1 ? '' : 's') + (st.at ? ' · updated ' + fmtAgo(st.at) : '') + (st.skipped ? ' · ' + st.skipped + ' skipped' : ''));
      return h('div', { class: 'set-row' },
        h('div', { class: 'lab' }, h('b', {}, r.name), h('span', { style: st.status === 'error' ? { color: 'var(--bad)' } : null }, host(r.url) + ' · ' + status)),
        h('div', { style: { display: 'flex', gap: '2px' } },
          h('button', { class: 'iconbtn plain', 'aria-label': 'Update ' + r.name, disabled: st.status === 'loading', onclick: () => R.refresh(r.id) }, icon('retry', 18)),
          h('button', { class: 'iconbtn plain', 'aria-label': 'Remove ' + r.name, onclick: () => RAW.sheet.confirm({ title: 'Remove repository?', text: '"' + r.name + '" and its videos will be removed from RAW Stream. Videos you downloaded stay on this phone.', ok: 'Remove', danger: true, onOk: () => { R.remove(r.id); repaint(); } }) }, icon('trash', 18))));
    });
    const off = bus.on('repos:change', () => { if (card.isConnected) repaint(); else off(); });
    const card = h('div', { class: 'set-card' },
      row('Repositories', list.length ? list.length + ' added' : 'Add a link to a list of videos you have the right to watch', h('button', { class: 'btn sm primary', onclick: addSheet }, icon('plus', 16), 'Add')),
      ...rows,
      row('Format', 'How to write your own repository file', h('button', { class: 'btn sm', onclick: formatSheet }, 'View')));
    return card;
  };
})();

/* ===== MODULE: downloads =====
   In-app download manager. Files are saved to private app storage (IndexedDB) so they
   play offline. Supports queue, pause/resume (HTTP Range), cancel, retry, speed, history.
   Only items flagged `downloadable` can be downloaded.
*/
(function () {
  const { h, icon, fmtBytes, qLabel, fmtAgo } = RAW.util;
  const { db, bus, store, settings } = RAW;
  const { Items } = RAW.data;

  const recs = new Map();      // key -> record
  const live = new Map();      // key -> { ctrl, tick }
  const CHUNK = 512 * 1024;
  const keyOf = (itemId, q) => itemId + '|' + q;

  const D = {
    list() { return [...recs.values()]; },
    get(key) { return recs.get(key); },
    forItem(itemId) { return D.list().filter(r => r.itemId === itemId); },
    done(itemId) { return D.forItem(itemId).filter(r => r.status === 'completed').sort((a, b) => b.q - a.q)[0] || null; },
    activeCount() { return D.list().filter(r => ['queued', 'downloading', 'paused'].includes(r.status)).length; },
    log() { return store.get('dllog', []); },
    addLog(r, status) { const l = D.log(); l.unshift({ title: r.title, q: r.q, size: r.size, status, t: Date.now() }); store.set('dllog', l.slice(0, 60)); },

    async init() {
      try {
        const rows = await db.all('dl');
        rows.forEach(({ v }) => {
          if (v.status === 'downloading' || v.status === 'queued') { v.status = 'paused'; v.note = 'Interrupted. Tap resume to continue.'; }
          v.speed = 0; recs.set(v.key, v);
        });
      } catch (e) { console.warn('downloads init failed', e); }
      const c = navigator.connection; if (c && c.addEventListener) c.addEventListener('change', () => pump());
      window.addEventListener('online', () => pump());
    },
    save(r) { return db.put('dl', r.key, r).catch(e => console.warn('dl save', e)); },
    emit() { bus.emit('dl:change'); },

    /* begin or queue a download */
    start(item, q) {
      if (!item.downloadable) { RAW.toast('This source does not allow downloads.'); return null; }
      const url = item.qualities[q] && item.qualities[q].url; if (!url) { RAW.toast('That quality is not available.'); return null; }
      const key = keyOf(item.id, q);
      const ex = recs.get(key);
      if (ex && ex.status === 'completed') { RAW.toast('Already downloaded.'); return ex; }
      if (ex && ['queued', 'downloading', 'paused'].includes(ex.status)) { RAW.toast('Already in your downloads.'); return ex; }
      const r = { key, itemId: item.id, title: item.title, q: Number(q), url, size: item.qualities[q].size || 0, loaded: 0, chunks: 0, status: 'queued', speed: 0, created: Date.now(), error: '' };
      recs.set(key, r); D.save(r); D.emit(); pump();
      RAW.toast(`Download added · ${qLabel(r.q)}`);
      return r;
    },
    pause(key) { const r = recs.get(key); if (!r || r.status !== 'downloading') { if (r && r.status === 'queued') { r.status = 'paused'; D.save(r); D.emit(); } return; } r.status = 'paused'; r.speed = 0; stop(key); D.save(r); D.emit(); pump(); },
    resume(key) { const r = recs.get(key); if (!r || !['paused', 'failed'].includes(r.status)) return; r.status = 'queued'; r.error = ''; r.note = ''; D.save(r); D.emit(); pump(); },
    retry(key) { D.resume(key); },
    async cancel(key) {
      const r = recs.get(key); if (!r) return;
      stop(key); recs.delete(key); D.addLog(r, 'canceled');
      await db.delPrefix('chunks', key + '#'); await db.del('dl', key); D.emit(); pump();
    },
    async remove(key) {
      const r = recs.get(key); if (!r) return;
      stop(key); recs.delete(key);
      await db.del('blobs', key); await db.delPrefix('chunks', key + '#'); await db.del('dl', key); D.emit();
    },
    async removeAll() { for (const r of D.list()) await D.remove(r.key); },
    async blobFor(key) { return db.get('blobs', key); },
    totalBytes() { return D.list().filter(r => r.status === 'completed').reduce((a, r) => a + (r.size || 0), 0); },
  };

  function stop(key) { const l = live.get(key); if (l) { try { l.ctrl.abort(); } catch { /* */ } clearInterval(l.tick); live.delete(key); } }

  function wifiBlocked() {
    if (!settings.get('wifiOnly')) return false;
    const c = navigator.connection; return !!(c && c.type === 'cellular');
  }
  function pump() {
    const max = Number(settings.get('maxDl')) || 2;
    let running = D.list().filter(r => r.status === 'downloading').length;
    for (const r of D.list()) {
      if (r.status !== 'queued') continue;
      if (wifiBlocked()) { if (r.note !== 'Waiting for Wi-Fi') { r.note = 'Waiting for Wi-Fi'; D.emit(); } continue; }
      if (r.note === 'Waiting for Wi-Fi') r.note = '';
      if (running >= max) break;
      running++; run(r);
    }
  }
  bus.on('setting:wifiOnly', pump); bus.on('setting:maxDl', pump);

  async function run(r) {
    const ctrl = new AbortController();
    let last = r.loaded, lastT = performance.now(), sm = 0;
    r.status = 'downloading'; r.error = ''; r.note = ''; D.emit();
    const tick = setInterval(() => {
      const now = performance.now(), cur = r.loaded + (r.live || 0), inst = (cur - last) / ((now - lastT) / 1000);
      sm = sm ? sm * 0.6 + inst * 0.4 : inst; r.speed = Math.max(0, sm); last = cur; lastT = now; D.emit();
    }, 700);
    live.set(r.key, { ctrl, tick });
    try {
      if (!navigator.onLine) throw fail('offline', 'No internet connection.');
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        if (est.quota && est.usage != null && est.quota - est.usage < (r.size - r.loaded) * 1.1) throw fail('storage', 'Not enough free storage for this download.');
      }
      const res = await fetch(r.url, { headers: r.loaded ? { Range: 'bytes=' + r.loaded + '-' } : {}, signal: ctrl.signal });
      if (!res.ok && res.status !== 206) throw fail('http', 'The server answered ' + res.status + '.');
      if (!res.body || !res.body.getReader) throw fail('http', 'Streaming downloads are not supported in this browser.');
      let skip = (r.loaded && res.status === 200) ? r.loaded : 0;   // server ignored Range: skip what we already have
      // The server's Content-Length is the real size; the size we showed before starting is only an estimate.
      const cl = Number(res.headers.get('content-length')) || 0;
      const expected = (cl && !res.headers.get('content-encoding')) ? (res.status === 206 ? r.loaded + cl : cl) : 0;
      if (expected) r.size = expected;
      const reader = res.body.getReader(); let buf = [], bufLen = 0;
      const flush = async () => {
        if (!bufLen) return;
        const blob = new Blob(buf); buf = []; bufLen = 0;
        try { await db.put('chunks', r.key + '#' + r.chunks, blob); } catch (e) { throw (e && e.name === 'QuotaExceededError') ? fail('storage', 'Not enough free storage for this download.') : e; }
        r.chunks++; r.loaded += blob.size; r.live = 0; D.save(r);
      };
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        let v = value;
        if (skip) { if (v.length <= skip) { skip -= v.length; continue; } v = v.subarray(skip); skip = 0; }
        buf.push(v); bufLen += v.length;
        r.live = bufLen;   // in-flight bytes, shown in progress until the chunk is flushed
        if (bufLen >= CHUNK) await flush();
      }
      await flush(); r.live = 0;
      if (expected && r.loaded < expected) throw fail('http', 'The download ended early. Retry to continue.');
      // assemble final file
      const parts = [];
      for (let i = 0; i < r.chunks; i++) parts.push(await db.get('chunks', r.key + '#' + i));
      await db.put('blobs', r.key, new Blob(parts, { type: /\.webm(\?|#|$)/i.test(r.url) ? 'video/webm' : 'video/mp4' }));
      await db.delPrefix('chunks', r.key + '#');
      r.status = 'completed'; r.finished = Date.now(); r.size = r.loaded || r.size; r.speed = 0;
      D.addLog(r, 'completed'); RAW.toast(`Downloaded · ${r.title}`);
    } catch (e) {
      if (ctrl.signal.aborted) { /* paused or canceled by user */ }
      else {
        r.status = 'failed'; r.speed = 0; r.error = e && e.userMsg ? e.userMsg : (e && e.name === 'TypeError' ? 'Network problem. Check your connection and retry.' : 'Download failed. Please retry.');
        D.addLog(r, 'failed'); console.warn('download failed', e);
      }
    } finally {
      stop(r.key); r.live = 0;
      if (recs.has(r.key)) D.save(r);
      D.emit(); pump();
    }
  }
  function fail(code, userMsg) { const e = new Error(code); e.userMsg = userMsg; return e; }

  /* quality picker shown before every download */
  D.pick = async function (item) {
    if (!item.downloadable) { RAW.toast('This source does not allow downloads.'); return; }
    const qs = Items.qualities(item);
    let free = '';
    try { const e = await navigator.storage.estimate(); if (e.quota) free = fmtBytes(e.quota - e.usage) + ' free'; } catch { /* */ }
    const pref = settings.get('dlQuality');
    let sel = pref === 'highest' ? qs[0] : (qs.includes(Number(pref)) ? Number(pref) : qs.slice().sort((a, b) => Math.abs(a - pref) - Math.abs(b - pref))[0]);
    const s = RAW.sheet.open({ title: 'Download' });
    const body = h('div', { class: 'qgrid' });
    const go = h('button', { class: 'btn primary' }, icon('download', 20), 'Download');
    function paint() {
      body.replaceChildren(...qs.map(q => {
        const ex = recs.get(keyOf(item.id, q));
        const state = ex ? (ex.status === 'completed' ? 'Downloaded' : 'In downloads') : '';
        return h('button', { class: 'qrow' + (q === sel ? ' on' : ''), onclick: () => { sel = q; paint(); } },
          h('b', {}, qLabel(q)), h('span', { class: 'muted small' }, state || (q >= 1080 ? 'Best detail' : q >= 720 ? 'Balanced' : 'Saves data')),
          h('span', { class: 'sz' }, '≈ ' + fmtBytes(RAW.data.sizeOf(item, q))), q === sel ? h('span', { class: 'ck' }, icon('check', 20)) : null);
      }));
    }
    paint();
    go.addEventListener('click', () => { s.close(); D.start(item, sel); });
    s.set([h('div', {}, h('b', {}, item.title), h('div', { class: 'faint small' }, 'Choose a quality. Only qualities this source provides are listed.')), body,
      h('div', { class: 'faint small', style: { display: 'flex', gap: '8px', alignItems: 'center' } }, icon('folder', 16), 'Saved to: RAW Stream app storage on this device' + (free ? ' · ' + free : '')), go]);
  };

  D.statusText = function (r) {
    if (r.status === 'downloading') return fmtBytes(r.speed) + '/s';
    if (r.status === 'queued') return r.note || 'Waiting in queue';
    if (r.status === 'paused') return r.note || 'Paused';
    if (r.status === 'failed') return r.error || 'Failed';
    if (r.status === 'completed') return 'Saved ' + fmtAgo(r.finished || r.created);
    return '';
  };
  void fmtAgo;

  RAW.downloads = D;
})();

/* ===== MODULE: player =====
   Full-screen player. RAW.player.open(ids, index) plays one item or a queue (playlist).
   Handles: gestures, seek, speed, quality (auto + manual with fallback), subtitles, audio tracks,
   PiP, fullscreen, orientation, resume position, and every failure path (offline, stream error,
   unsupported format, missing file) without crashing.
*/
(function () {
  const { h, icon, fmtTime, qLabel, fmtBytes, clamp } = RAW.util;
  const { Items, History } = RAW.data;
  const { settings, toast, bus } = RAW;

  let root, video, els = {};

        paint();

        el._cleanup = off;
      },
    };
  })();

  RAW.screens.push(Home, Search, MyVideos, Downloads, Library);
  RAW.ui = { card, row, thumb, empty, itemMenu, detail, playItem, pickFiles };
  void logo;
})();

/* ===== MODULE: settings =====
   Settings are declared as data. To add a setting, push an item into a group
   (or push a new group) in RAW.settingsSchema:
     { key, label, desc, type: 'toggle' | 'select' | 'swatches', options: [[value,label]], default }
   Reading it anywhere:  RAW.settings.get('key')
*/
(function () {
  const { h, icon, logo, fmtBytes } = RAW.util;
  const S = RAW.settings;

  const SPEEDS = [[0.5, '0.5×'], [0.75, '0.75×'], [1, 'Normal'], [1.25, '1.25×'], [1.5, '1.5×'], [2, '2×']];
  const QS = [[480, '480p'], [720, '720p'], [1080, '1080p'], [1440, '2K (1440p)'], [2160, '4K (2160p)'], [4320, '8K (4320p)']];

  RAW.settingsSchema.push(
    { section: 'Appearance', items: [
      { key: 'theme', label: 'Theme', desc: 'Dark, Light, or follow your phone', type: 'select', options: [['system', 'System'], ['dark', 'Dark'], ['light', 'Light']] },
      { key: 'accent', label: 'Accent color', type: 'swatches', options: ['#ff6b4a', '#ffb020', '#2fb8f0', '#3cc86a', '#ff5fa2', '#9b82ff'] },
      { key: 'anim', label: 'Animations', desc: 'Turn off for the lightest, fastest feel', type: 'toggle' },
    ] },
    { section: 'Player', items: [
      { key: 'autoQ', label: 'Auto quality', desc: 'Pick the best quality your device and connection can handle', type: 'toggle' },
      { key: 'defQuality', label: 'Default quality', desc: 'Used when Auto quality is off. The closest quality the video has is used.', type: 'select', options: QS, num: true },
      { key: 'defSpeed', label: 'Default playback speed', type: 'select', options: SPEEDS, num: true },
      { key: 'autoFs', label: 'Auto fullscreen', desc: 'Go fullscreen when playback starts', type: 'toggle' },
      { key: 'remember', label: 'Remember position', desc: 'Resume where you stopped', type: 'toggle' },
      { key: 'autoNext', label: 'Play next automatically', desc: 'In playlists and search results', type: 'toggle' },
      { key: 'subPref', label: 'Subtitle preference', type: 'select', options: [['off', 'Off'], ['en', 'English'], ['bn', 'বাংলা']] },
    ] },
    { section: 'Downloads', items: [
      { key: 'dlQuality', label: 'Default quality', desc: 'Pre-selected in the download picker', type: 'select', options: [['highest', 'Highest available']].concat(QS), num: true },
      { type: 'info', label: 'Download location', value: 'App storage', desc: 'Private to RAW Stream on this device. Works offline. A web app cannot write to other folders.' },
      { key: 'wifiOnly', label: 'Wi-Fi only', desc: 'Wait for Wi-Fi where the browser can tell', type: 'toggle' },
      { key: 'maxDl', label: 'Simultaneous downloads', type: 'select', options: [[1, '1'], [2, '2'], [3, '3'], [4, '4']], num: true },
    ] },
    { section: 'Video sources', custom: 'repos' },
    { section: 'Storage', custom: 'storage' },
    { section: 'About', custom: 'about' },
  );

  function control(it, repaint) {
    const val = S.get(it.key);
    if (it.type === 'toggle') return h('button', { class: 'switch' + (val ? ' on' : ''), role: 'switch', 'aria-checked': String(!!val), 'aria-label': it.label, onclick: () => { S.set(it.key, !val); repaint(); } });
    if (it.type === 'select') return h('select', { class: 'sel', id: 'set-' + it.key, 'aria-label': it.label, style: { height: '38px' }, onchange: e => { const v = e.target.value; S.set(it.key, it.num && v !== 'highest' ? Number(v) : v); repaint(); } },
      ...it.options.map(([v, l]) => h('option', { value: v, selected: String(v) === String(val) }, l)));
    if (it.type === 'swatches') return h('div', { class: 'swatches' }, ...it.options.map(c => h('button', { class: 'sw' + (c === val ? ' on' : ''), style: { background: c }, 'aria-label': 'Accent ' + c, 'aria-pressed': String(c === val), onclick: () => { S.set(it.key, c); repaint(); } })));
    if (it.type === 'info') return h('span', { class: 'muted', style: { fontWeight: 700 } }, it.value);
    return null;
  }

  async function storageCard(repaint) {
    let est = null; try { est = await navigator.storage.estimate(); } catch { /* unsupported */ }
    let thumbBytes = 0; try { (await RAW.db.all('thumbs')).forEach(r => { thumbBytes += String(r.v).length; }); } catch { /* */ }
    const dlBytes = RAW.downloads.totalBytes();
    const row = (label, desc, right) => h('div', { class: 'set-row' }, h('div', { class: 'lab' }, h('b', {}, label), desc ? h('span', {}, desc) : null), right);
    const pct = est && est.quota ? Math.min(100, Math.round(est.usage / est.quota * 100)) : 0;
    return h('div', { class: 'set-card' },
      row('Storage information', est && est.quota ? fmtBytes(est.usage) + ' used of ' + fmtBytes(est.quota) + ' available to RAW Stream' : 'Your browser does not report storage', est && est.quota ? h('span', { class: 'pill' }, pct + '%') : null),
      row('Downloaded videos', RAW.downloads.list().filter(r => r.status === 'completed').length + ' offline videos', h('b', {}, fmtBytes(dlBytes))),
      row('Cache size', 'Thumbnails of your phone videos', h('b', {}, fmtBytes(thumbBytes))),
      row('Clear cache', 'Removes thumbnails. They are rebuilt when needed.', h('button', { class: 'btn sm', onclick: async () => { await RAW.data.Local.clearThumbs(); RAW.toast('Cache cleared'); repaint(); } }, 'Clear')),
      row('Delete all downloads', 'Frees the space used by offline videos', h('button', { class: 'btn sm danger', disabled: !dlBytes && !RAW.downloads.list().length, onclick: () => RAW.sheet.confirm({ title: 'Delete all downloads?', text: 'Every offline video and any unfinished download will be removed from this device.', ok: 'Delete all', danger: true, onOk: async () => { await RAW.downloads.removeAll(); RAW.toast('Downloads deleted'); repaint(); } }) }, 'Delete')));
  }

  function aboutCard(repaint, close) {
    return h('div', { class: 'set-card' },
      h('div', { class: 'set-row', style: { gap: '14px' } }, logo(48), h('div', { class: 'lab' }, h('b', { style: { fontFamily: 'var(--font-display)', letterSpacing: '.14em' } }, 'RAW Stream'), h('span', {}, 'Stream, download and watch your own videos'))),
      h('div', { class: 'set-row' }, h('div', { class: 'lab' }, h('b', {}, 'Developer')), h('span', { class: 'muted', style: { fontWeight: 700 } }, RAW.developer)),
      h('div', { class: 'set-row' }, h('div', { class: 'lab' }, h('b', {}, 'Version')), h('span', { class: 'muted', style: { fontWeight: 700 } }, RAW.version)),
      h('div', { class: 'set-row' }, h('div', { class: 'lab' }, h('b', {}, 'Reset settings'), h('span', {}, 'Restore every setting to its default')),
        h('button', { class: 'btn sm', onclick: () => { S.reset(); RAW.applyAppearance(); RAW.toast('Settings reset'); repaint(); } }, 'Reset')));
    void close;
  }

  function open() {
    const sheet = RAW.sheet.open({ title: 'Settings', full: true });
    async function paint() {
      const kids = [];
      for (const g of RAW.settingsSchema) {
        let card;
        if (g.custom === 'storage') card = await storageCard(paint);
        else if (g.custom === 'repos') card = RAW.repos.card(paint);
        else if (g.custom === 'about') card = aboutCard(paint, () => sheet.close());
        else card = h('div', { class: 'set-card' }, ...g.items.map(it => h('div', { class: 'set-row' },
          h('div', { class: 'lab' }, h('b', {}, it.label), it.desc ? h('span', {}, it.desc) : null), control(it, paint))));
        kids.push(h('div', { class: 'set-sec' }, h('h3', {}, g.section), card));
      }
      if (sheet.wrap.isConnected) sheet.set(kids);
    }
    paint();
  }
  RAW.openSettings = open;
})();

/* ===== MODULE: main =====
   App shell (top bar, screen area, bottom navigation), router and startup.
*/
(function () {
  const { h, icon, logo } = RAW.util;
  const bus = RAW.bus;
  let main, nav, current = null, offline;
  const scroll = {};

  const router = RAW.router = {
    show(id) {
      const sc = RAW.screens.find(s => s.id === id) || RAW.screens[0];
      if (current) scroll[current.id] = main.scrollTop;
      if (main.firstChild && main.firstChild._cleanup) { try { main.firstChild._cleanup(); } catch { /* */ } }
      current = sc;
      const el = h('div', { class: 'screen', id: 'scr-' + sc.id });
      try { sc.render(el); } catch (e) { console.warn('screen failed', sc.id, e); el.replaceChildren(h('div', { class: 'empty' }, icon('info', 30), h('b', {}, 'This screen hit a problem'), h('div', {}, 'The rest of the app is fine. Try another tab, then come back.'))); }
      main.replaceChildren(el);
      main.scrollTop = scroll[sc.id] || 0;
      paintNav();
    },
    refresh() { if (current) { const t = main.scrollTop; this.show(current.id); main.scrollTop = t; } },
  };

  function paintNav() {
    nav.replaceChildren(...RAW.screens.map(s => {
      const n = s.badge ? s.badge() : 0;
      return h('button', { class: current && current.id === s.id ? 'on' : '', 'aria-label': s.label, 'aria-current': current && current.id === s.id ? 'page' : null, onclick: () => router.show(s.id) },
        icon(s.icon, 24), h('span', {}, s.label), n ? h('span', { class: 'badge' }, n) : null);
    }));
  }

  function shell() {
    main = h('div', { id: 'main' });
    nav = h('nav', { class: 'nav', 'aria-label': 'Main' });
    offline = h('div', { class: 'offline-pill', role: 'status', hidden: true }, icon('wifi', 16), 'You are offline. Downloads and My Videos still play.');
    const app = h('div', { id: 'app' },
      h('header', { class: 'topbar' }, h('div', { class: 'brand' }, logo(34), h('div', { class: 'brand-text' }, h('span', { class: 'brand-word' }, 'RAW ', h('b', {}, 'STREAM')), h('span', { class: 'brand-dev' }, 'Developer SR Shadikur Rahman'))),
        h('button', { class: 'iconbtn', 'aria-label': 'Settings', onclick: () => RAW.openSettings() }, icon('sliders', 20))),
      offline, main, nav);
    document.body.insertBefore(app, document.getElementById('splash'));
    const setOff = () => { offline.hidden = navigator.onLine; };
    addEventListener('online', setOff); addEventListener('offline', setOff); setOff();
  }

  function splash() {
    const sp = document.getElementById('splash');
    sp.replaceChildren(h('div', { class: 'splash-in' }, h('div', { class: 'splash-mark' }, logo(88)),
      h('div', { class: 'splash-word' }, 'RAW ', h('b', {}, 'STREAM')), h('div', { class: 'splash-bar' }, h('i', {})), h('div', { class: 'splash-dev' }, 'Developer SR Shadikur Rahman')));
  }

  let rt = 0;
  function softRefresh() {
    if (rt) return;
    rt = setTimeout(() => { rt = 0; if (current && current.id === 'home' && !RAW.player.isOpen()) router.refresh(); }, 120);
  }

  async function boot() {
    const t0 = Date.now();
    RAW.applyAppearance(); splash();
    shell();
    try { await Promise.all([RAW.data.loadSources(), RAW.data.Local.load(), RAW.downloads.init()]); }
    catch (e) { console.warn('startup data problem', e); }
    try { RAW.repos.init(); } catch (e) { console.warn('repositories could not start', e); }
    router.show('home');
    ['lib:change', 'home:layout', 'local:change', 'player:close'].forEach(ev => bus.on(ev, softRefresh));
    let sig = '';
    bus.on('dl:change', () => {
      const s = RAW.downloads.list().map(r => r.key + r.status).join();
      if (s !== sig) { sig = s; paintNav(); softRefresh(); }
    });
    bus.on('player:close', () => paintNav());
    const wait = Math.max(0, 1250 - (Date.now() - t0));
    setTimeout(() => document.getElementById('splash').classList.add('done'), wait);
    RAW.ready = true; bus.emit('ready');
  }
  boot().catch(e => {
    console.warn('boot failed', e);
    document.getElementById('splash').classList.add('done');
    document.body.appendChild(h('div', { class: 'empty', style: { position: 'fixed', inset: 0, background: 'var(--bg)' } }, h('b', {}, 'RAW Stream could not start'), h('div', {}, 'Reload the page. Your saved videos and settings are safe.')));
  });
})();


if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

</script>
